<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gatan Comprehensive System</title>
    <meta name="description" content="Comprehensive system for management of inventory, suppliers, monthly sales, COGS calculation, orders, payroll, and expenses with offline support." />
    <meta property="og:title" content="Gatan Comprehensive System" />
    <meta property="og:description" content="Comprehensive system for management of inventory, suppliers, monthly sales, COGS calculation, orders, payroll, and expenses with offline support." />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('gatan_theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('light', theme === 'light');
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
